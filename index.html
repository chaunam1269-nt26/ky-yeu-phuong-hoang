<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kỷ yếu 10 năm Phượng Hoàng</title>
<meta name="description" content="Kỷ yếu 10 năm Trường PTCLC Phượng Hoàng · Truyền lửa – Sải cánh vươn xa (2016–2026)">
<meta property="og:title" content="Kỷ yếu 10 năm Phượng Hoàng">
<meta property="og:description" content="Kỷ yếu 10 năm Trường PTCLC Phượng Hoàng · Truyền lửa – Sải cánh vươn xa (2016–2026)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1a14; --paper:#fff8ee; --paper2:#f6e9d3; --flame:#e8590c; --ember:#c92a2a; --gold:#e5a50a; --night:#1b1226; --muted:#7a6558;
  --shadow:0 20px 50px rgba(60,20,0,.25);
}
@media (prefers-color-scheme:dark){:root{--ink:#f5e8d8;--paper:#241a1d;--paper2:#2e2024;--muted:#b9a496;--night:#120b18}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#4a1d12 0,var(--night) 70%);overflow:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:54px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left));z-index:20;color:#ffe9cf}
.bar .brand{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.02em;font-size:17px}
.bar .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.1)}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn.off{opacity:.55;text-decoration:line-through}
.ibtn.on{background:var(--flame)}
.edbar{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:60;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:var(--night);color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.edbar.on{display:flex}
.edbar button{padding:7px 14px;border-radius:9px;background:var(--flame);color:#fff;font-weight:600;font-size:13px}
.edbar button.g{background:rgba(255,255,255,.14)}
.edbar button:disabled{opacity:.6}
.vid .vbtn,.vid .vframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-bottom:10px;background:linear-gradient(135deg,var(--night),var(--ember))}
.vid .vbtn{display:grid;place-items:center;cursor:pointer}
.vid .vbtn span{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ember);display:grid;place-items:center;font-size:26px;padding-left:4px}
.vid a{display:inline-block;margin-top:8px;font-size:13px;color:var(--flame);font-weight:600}
.memwrap{position:fixed;inset:0;z-index:80;background:rgba(10,5,20,.6);display:none;place-items:center;padding:12px}
.memwrap.on{display:grid}
.mem{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.mem .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mem .mh .ibtn{background:var(--paper2);color:var(--ink)}
.mem h3{margin:16px 0 8px;font-size:15px}
.mem .mrow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--paper2);font-size:14px}
.mem .mrow.off{opacity:.5}
.mem .mrow span{display:flex;gap:6px;flex-shrink:0}
.mem button:not(.ibtn){padding:6px 12px;border-radius:8px;background:var(--flame);color:#fff;font-weight:600;font-size:13px}
.mem button.g{background:var(--paper2);color:var(--ink)}
.mem code{background:var(--paper2);padding:1px 6px;border-radius:5px}
.mem form{display:grid;gap:8px}
.mem input,.mem select{padding:9px 10px;border:1px solid #d9c7a8;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
.mem .mn{color:var(--muted);font-size:13px}
.mem textarea{padding:9px 10px;border:1px solid #d9c7a8;border-radius:8px;background:#fff;font:inherit;color:var(--ink);resize:vertical}
.mem .ck{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.mem .ck input{margin-top:3px;width:auto;flex:none;padding:0}
.mem #ctForm{display:grid;gap:8px}
.cimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--paper2)}
.cmeta{font-size:13px;color:var(--muted);margin-top:4px}
.card details summary{cursor:pointer;color:var(--flame);font-weight:600;font-size:14px;margin-top:8px}
body.editing [contenteditable]{outline:1px dashed var(--flame);outline-offset:2px;cursor:text}
body.editing [contenteditable]:focus{outline:2px solid var(--flame);background:#fff4e0;color:var(--ink)}
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--ember));z-index:30;transition:width .4s}

/* book */
.stage{position:fixed;inset:54px 0 64px 0;display:grid;place-items:center;perspective:1800px;padding:0 12px}
.page{position:absolute;width:min(920px,100%);height:100%;max-height:760px;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:var(--shadow);overflow:auto;padding:clamp(22px,4vw,52px);opacity:0;pointer-events:none;transform:rotateY(-14deg) translateX(40px);transform-origin:left center;transition:opacity .45s,transform .55s cubic-bezier(.2,.7,.2,1)}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page.out{transform:rotateY(14deg) translateX(-40px)}
.page::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent);pointer-events:none}
.pn{position:absolute;right:20px;bottom:12px;font-size:12px;color:var(--muted)}
.kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--flame);font-weight:600;margin-bottom:8px}
.page h2{font-size:clamp(26px,4.2vw,40px);margin-bottom:6px}
.lead{color:var(--muted);margin:6px 0 22px;max-width:62ch}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding:6px 12px;margin-top:18px;background:rgba(229,165,10,.08);border-radius:0 8px 8px 0}
.art{max-width:68ch}
.art p{margin:0 0 12px;line-height:1.7}
.art h3.sub{font-size:21px;margin:22px 0 10px;color:var(--ember)}
.art blockquote{margin:4px 0 14px;padding:10px 16px;border-left:3px solid var(--flame);background:var(--paper2);border-radius:0 10px 10px 0;font-style:italic;line-height:1.65}
.card.blank{border:1.5px dashed rgba(232,89,12,.45);background:transparent}
.grid.four{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.thx{background:var(--paper2);border-radius:12px;padding:14px 16px}
.thx q{display:block;font-family:'Playfair Display',serif;font-style:italic;font-size:17px;line-height:1.5}
.thx small{display:block;margin-top:6px;color:var(--muted)}
.todo{display:inline-block;background:#fff1c9;color:#7a5200;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
@media (prefers-color-scheme:dark){.todo{background:#4a3a10;color:#ffd77a}}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff3df;background:radial-gradient(circle at 50% 78%,#ff9d2e 0,#e8590c 22%,#8e1b1b 55%,#2a0f16 100%)}
.cover::before{display:none}
.cover{background:url(bia-truong.jpg) center/cover}
.cover .yr,.cover h1,.cover .tag{text-shadow:0 2px 4px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.85),0 0 36px rgba(0,0,0,.6)}
.cover .yr{color:#fff;font-weight:700}
.cover .tag{color:#fff;opacity:1;font-weight:600}
.cover .flame{filter:drop-shadow(0 0 18px #ffb347) drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.cover .clogo{width:clamp(72px,13vh,110px);height:auto;border-radius:16px;background:#fff;border:3px solid #fff3df;box-shadow:0 6px 24px rgba(0,0,0,.45);margin-top:-6px}
.ph2{margin:0;border-radius:12px;overflow:hidden;background:var(--paper2);box-shadow:0 6px 18px rgba(60,20,0,.15)}
.ph2 img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ph2 figcaption{padding:8px 12px;font-size:13px;color:var(--muted)}
.cover .gv{height:clamp(84px,27vh,300px);width:auto;max-width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%;border-radius:12px;border:3px solid rgba(255,243,223,.85);box-shadow:0 10px 30px rgba(0,0,0,.45);margin-top:clamp(8px,2.4vh,22px)}
.cover .flame{font-size:84px;filter:drop-shadow(0 0 28px #ffb347);animation:fl 2.6s ease-in-out infinite}
@keyframes fl{50%{transform:scale(1.07) translateY(-4px)}}
.cover h1{font-size:clamp(38px,8vw,78px);font-weight:800;margin:8px 0}
.cover .yr{font-size:clamp(18px,3vw,28px);letter-spacing:.3em;color:#ffd98a}
.cover .tag{margin-top:18px;font-size:15px;opacity:.9;max-width:44ch}
.cover .path{margin-top:30px;display:flex;gap:10px;align-items:center;font-size:14px;color:#ffd98a}
.cover .start{margin-top:34px;padding:13px 30px;border-radius:99px;background:#fff3df;color:#8e1b1b;font-weight:700}
.cover .pn{color:#ffd98a}
.cover .flame{font-size:clamp(38px,8vh,84px)}
.cover h1{font-size:clamp(28px,min(8vw,9.5vh),78px);margin:4px 0}
.cover .tag{margin-top:clamp(4px,1.6vh,18px)}
.cover .start{margin-top:clamp(10px,3vh,34px);padding:clamp(8px,1.6vh,13px) 30px}

/* toc */
.toc a{display:flex;gap:14px;align-items:baseline;padding:10px 4px;border-bottom:1px dashed rgba(122,101,88,.35);text-decoration:none;color:inherit}
.toc a:hover{color:var(--flame)}
.toc .n{font-family:'Playfair Display';font-weight:800;color:var(--flame);width:2.2em}
.toc .d{flex:1;font-size:13px;color:var(--muted)}
.toc .t{font-weight:600}

/* generic grids */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--paper2);border-radius:14px;padding:16px}
.card h3{font-size:18px;margin-bottom:4px}
.card p{font-size:14px;color:var(--muted)}
.ph{aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(45deg,rgba(232,89,12,.1) 0 10px,rgba(232,89,12,.18) 10px 20px);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:8px;margin-bottom:10px}
.ph.p{aspect-ratio:3/4}
.qr{display:inline-flex;align-items:center;gap:8px;font-size:12px;border:1px dashed var(--flame);padding:5px 10px;border-radius:8px;color:var(--flame);margin-top:8px}
.qr i{font-style:normal;font-size:16px}

/* timeline */
.tl{position:relative;margin-left:8px;padding-left:26px;border-left:3px solid;border-image:linear-gradient(var(--gold),var(--ember)) 1}
.tl .it{position:relative;margin-bottom:16px;cursor:pointer}
.tl .it::before{content:"";position:absolute;left:-36px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--flame)}
.tl .it.era::before{background:var(--flame)}
.tl b{font-family:'Playfair Display';font-size:19px;color:var(--flame)}
.tl p{font-size:14px;color:var(--muted)}
.era-tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--flame);color:#fff;margin-left:8px;vertical-align:middle}

/* 3 chapters */
.chap{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chap .c{border-radius:16px;padding:22px;color:#fff}
.c1{background:linear-gradient(135deg,#f08c00,#e8590c)}.c2{background:linear-gradient(135deg,#e8590c,#c92a2a)}.c3{background:linear-gradient(135deg,#c92a2a,#5f1d48)}
.chap .c .ic{font-size:34px}.chap .c h3{font-size:24px;margin:6px 0}.chap .c small{opacity:.85}

/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{text-align:center;padding:18px 8px;border-radius:14px;background:var(--paper2)}
.stat .v{font-family:'Playfair Display';font-size:34px;font-weight:800;color:var(--flame)}
.stat .l{font-size:12.5px;color:var(--muted)}

/* pillars */
.pill{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:640px){.pill{grid-template-columns:repeat(2,1fr)}}
.pill div{background:linear-gradient(var(--paper2),var(--paper));border:1px solid rgba(229,165,10,.4);border-radius:12px;padding:14px 8px;text-align:center;font-weight:600;font-size:14px}
.pill div span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}

/* stories */
.story{display:flex;gap:14px;align-items:flex-start}
.story .no{font-family:'Playfair Display';font-size:40px;font-weight:800;color:var(--flame);line-height:1}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:99px;background:var(--paper2);font-size:13px}
.chip.on{background:var(--flame);color:#fff}

/* form */
form.cap{display:grid;gap:10px;max-width:560px}
input,textarea,select{font:inherit;width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(122,101,88,.4);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{padding:12px 22px;border-radius:99px;background:linear-gradient(90deg,var(--flame),var(--ember));color:#fff;font-weight:700;justify-self:start}
.msgs{display:grid;gap:10px;margin-top:20px}
.msg{background:var(--paper2);border-radius:12px;padding:12px 14px;font-size:14px}
.msg small{color:var(--muted)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;height:64px;display:flex;align-items:center;justify-content:center;gap:16px;z-index:20;color:#ffe9cf}
.nav .lbl{min-width:180px;text-align:center;font-size:13px;opacity:.9}

/* drawer */
.drawer{position:fixed;inset:0 auto 0 0;width:min(340px,86vw);background:var(--paper);z-index:40;transform:translateX(-105%);transition:transform .35s;padding:70px 18px 18px;overflow:auto;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer button{display:block;width:100%;text-align:left;padding:10px 8px;border-radius:8px;font-size:14px}
.drawer button:hover,.drawer button.cur{background:var(--paper2);color:var(--flame)}
.drawer h4{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--flame);margin:14px 8px 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
@media(max-width:560px){.bar .brand{font-size:14px}.nav .lbl{min-width:120px}.stage{inset:54px 0 64px 0;padding:0 6px}}
@media print{body{overflow:visible;background:#fff}.bar,.nav,.prog{display:none}.stage{position:static;display:block}.page{position:static;opacity:1;transform:none;box-shadow:none;max-height:none;height:auto;page-break-after:always;overflow:visible}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="bar">
  <button class="ibtn" id="menu" aria-label="Mục lục">☰</button>
  <span class="brand">🔥 Kỷ yếu Phượng Hoàng</span>
  <span class="sp"></span>
  <button class="ibtn" id="music" aria-label="Bật/tắt nhạc nền" title="Nhạc nền">♪</button>
  <button class="ibtn" id="share" aria-label="Chia sẻ trang">⤴</button>
  <button class="ibtn" id="print" aria-label="Xuất PDF / In">⎙</button>
  <button class="ibtn" id="edit" aria-label="Biên tập (thành viên)" title="Biên tập — dành cho thành viên">✎</button>
</div>
<div class="stage" id="stage"></div>
<div class="memwrap" id="ctWrap"><div class="mem"><div class="mh"><b>➕ Đóng góp nội dung</b><button id="ctClose" class="ibtn" aria-label="Đóng">✕</button></div><div id="ctBox"></div></div></div>
<div class="memwrap" id="memWrap"><div class="mem"><div class="mh"><b>👥 Thành viên &amp; duyệt bài</b><button id="memClose" class="ibtn" aria-label="Đóng">✕</button></div><div id="memBox"></div></div></div>
<div class="edbar" id="edbar"><span id="edmsg"></span><button id="edSave">Lưu</button><button id="edAdd" class="g">➕ Đóng góp</button><button id="edMem" class="g" style="display:none">👥 Thành viên</button><button id="edExit" class="g">Thoát</button><button id="edOut" class="g">Đăng xuất</button></div>
<div class="nav">
  <button class="ibtn" id="prev" aria-label="Trang trước">‹</button>
  <span class="lbl" id="lbl"></span>
  <button class="ibtn" id="next" aria-label="Trang sau">›</button>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
/* =====================================================================
   NỘI DUNG KỶ YẾU — sửa trực tiếp ở đây.
   Các chỗ đánh dấu TODO(...) là số liệu/ảnh/tên cần Ban biên soạn xác minh.
   ===================================================================== */
const ART = {
 p6:{lead:"Một trăn trở về giáo dục quê hương, một lựa chọn và hành trình bắt đầu từ năm 2009.", body:`
<p>Có những ngôi trường được bắt đầu từ một bản thiết kế, một khu đất hay một quyết định đầu tư. Nhưng với Phượng Hoàng, phía sau sự ra đời của ngôi trường là một câu hỏi đã được đặt ra từ nhiều năm trước: Vì sao con em Nghệ An muốn được học tập trong một môi trường giáo dục tốt, hiện đại và chuẩn mực lại phải đi thật xa?</p>
<p>Đó là nỗi trăn trở của ông Nguyễn Châu Nam và bà Đinh Thị Lệ Thanh – hai người cùng đặt những viên gạch đầu tiên cho hành trình Phượng Hoàng.</p>
<h3 class="sub">Từ một trăn trở đến một lựa chọn</h3>
<p>Trong quá trình làm việc, tiếp xúc với nhiều mô hình giáo dục, ông Nguyễn Châu Nam nhận thấy khoảng cách giữa mong muốn của các gia đình về một môi trường học tập chất lượng và những lựa chọn thực tế tại địa phương. Không phải gia đình nào cũng có điều kiện đưa con đến học tại các thành phố lớn hay những trường quốc tế có mức học phí cao.</p>
<p>Ông Nam kể về trăn trở ban đầu:</p><blockquote>“Nhiều năm làm việc với các đối tác, tôi luôn trăn trở: vì sao con em mình muốn học trong một môi trường chuẩn mực, hiện đại thì phải đi thật xa? Mô hình liên cấp chất lượng cao ở Nghệ An khi ấy còn rất mới, mọi thứ phải làm từ đầu. Khó khăn lớn nhất của năm 2016 là niềm tin. Tháng 6 mới có quyết định cho phép hoạt động, tháng 9 đã khai giảng. Kế hoạch là sáu lớp, cuối cùng có ba lớp, chưa đến một trăm cháu. Có người khuyên nên thu hẹp cho đỡ tốn kém. Vợ chồng tôi đã bàn nhau rất nhiều đêm. Nhưng tôi nghĩ, ít học sinh thì càng phải dạy thật tốt, mỗi cháu phải được chăm chút như một hạt giống.”</blockquote>
<p>Những chuyến tìm hiểu, khảo sát các mô hình trường học trong và ngoài nước tiếp tục giúp hai người sáng lập định hình lựa chọn của mình. Họ không hướng tới việc xây dựng một trường quốc tế với mức học phí cao, mà lựa chọn mô hình trường phổ thông tư thục liên cấp chất lượng cao, có khả năng kết hợp những giá trị giáo dục tiến bộ với mức học phí hợp lý hơn.</p>
<p>Đó là một lựa chọn không đơn giản. Bởi xây dựng một ngôi trường chất lượng cao không chỉ cần nguồn lực đầu tư, mà còn đòi hỏi một quan niệm giáo dục rõ ràng, sự kiên trì và niềm tin vào con đường đã chọn.</p>
<div class="note"><span class="todo">chờ bổ sung</span> Lời kể của bà Đinh Thị Lệ Thanh. Câu hỏi gợi ý: Ở góc nhìn của người đồng sáng lập, bà Đinh Thị Lệ Thanh nhớ gì về những ngày đầu hình thành ý tưởng? Điều gì khiến bà tin tưởng và cùng ông Nam theo đuổi mô hình trường học ấy? Bà trực tiếp tham gia những công việc nào trong quá trình chuẩn bị? Đâu là khó khăn hoặc quyết định khiến bà nhớ nhất?</div>
<p>Hai người có thể có những cách nhìn và trải nghiệm khác nhau, nhưng cùng gặp nhau ở một mong muốn: tạo dựng tại Nghệ An một môi trường giáo dục tốt, để học sinh được học tập và trưởng thành trên chính quê hương mình.</p>
<h3 class="sub">Những viên gạch đầu tiên</h3>
<p>Ngày 12/6/2009, Ủy ban nhân dân tỉnh Nghệ An ban hành Quyết định số 2739/QĐ-UBND.ĐT cho phép thành lập Trường Phổ thông Chất lượng cao Phượng Hoàng. Ngày 01/6/2010, Nhà trường được cấp mã số thuế. Những dấu mốc ấy ghi nhận bước khởi đầu về mặt pháp lý và tổ chức của một dự định giáo dục đang dần trở thành hiện thực.</p>
<p>Khu đất tại số 18 Duy Tân được lựa chọn để xây dựng ngôi trường. Từ đây, hành trình chuẩn bị đầu tư, xây dựng cơ sở vật chất, định hình mô hình hoạt động và tìm kiếm những con người cùng chung tâm huyết từng bước được triển khai.</p>
<p>Nhìn lại, quyết định thành lập năm 2009 không đơn thuần là sự khởi đầu của một cơ sở giáo dục. Đó còn là sự khởi đầu của một lựa chọn: xây dựng một ngôi trường chất lượng cao ngay tại quê hương, nơi học sinh không chỉ được trang bị kiến thức mà còn có cơ hội phát triển toàn diện.</p>
<p>Từ một câu hỏi về cơ hội học tập của con em quê hương, một ngôi trường đã bắt đầu hình thành. Và từ những viên gạch đầu tiên ấy, hành trình Phượng Hoàng được tiếp nối. Bảy năm chuẩn bị đã mở ra một chặng đường không ít thử thách. Để rồi đến năm 2016, những học trò đầu tiên chính thức bước qua cánh cổng Phượng Hoàng.</p>`},
 p7:{lead:"Từ quyết định thành lập năm 2009 đến ngày khai trường tháng 9/2016, Phượng Hoàng đã đi qua bảy năm chuẩn bị. Ngày đầu tiên, ngôi trường đón ba lớp học với gần một trăm học sinh, cùng những người thầy và những gia đình đã đặt niềm tin vào một hành trình còn ở phía trước.", body:`
<p>Tháng 4/2016, Báo Nghệ An giới thiệu Phượng Hoàng là một trong những cơ sở giáo dục phổ thông chất lượng cao đầu tiên của tỉnh. Đằng sau sự ghi nhận ấy là một mùa hè đầy tất bật. Ngày 04/6, Nhà trường công bố kế hoạch tuyển sinh đầu tiên. Ngày 24/6, Sở Giáo dục và Đào tạo Nghệ An ban hành Quyết định số 667/QĐ-SGDĐT cho phép hoạt động giáo dục. Tháng 7, những chương trình trải nghiệm hè và giao lưu mỹ thuật đầu tiên được tổ chức, đưa học sinh và phụ huynh đến gần hơn với ngôi trường mới.</p>
<p>Cùng với việc hoàn thiện những điều kiện để đón học sinh, Nhà trường bắt đầu tìm kiếm những người thầy đầu tiên – những người sẽ cùng đặt nền nếp, xây dựng văn hóa dạy và học cho một ngôi trường vừa hình thành. Nhà giáo Ưu tú Đậu Văn Mùi, nguyên Hiệu trưởng Trường THPT chuyên Phan Bội Châu, được mời đảm nhiệm cương vị Hiệu trưởng đầu tiên. Nhớ về năm học đầu tiên với quy mô chưa đến một trăm học sinh, thầy chia sẻ:</p>
<blockquote>“Năm học đầu tiên, cả trường chưa đến một trăm cháu. Tôi tự giao cho mình một việc: phải nhớ tên từng em, nhìn em nào cũng biết hôm nay em vui hay em buồn.”</blockquote>
<p>Sự quan tâm đến từng học sinh cũng trở thành tinh thần chung mà đội ngũ giáo viên muốn xây dựng ngay từ những ngày đầu:</p>
<blockquote>“Anh em giáo viên chúng tôi thống nhất với nhau: ‘Dạy bằng cả trái tim, học bằng cả khát vọng’. Dạy kiến thức, dạy cả kỹ năng. Em nào nhanh thì cho em đi xa hơn, em nào chậm thì mình chờ, không để em nào bị bỏ lại và các em sẽ tiến bộ hơn chính mình ngày hôm qua.”</blockquote>
<p>Ngày khai trường, kế hoạch tuyển sinh ban đầu là sáu lớp, nhưng thực tế chỉ có ba lớp, gồm hai lớp 6 và một lớp 1, với gần một trăm học sinh. Với thầy Mùi, quy mô nhỏ không phải lý do để giảm đi sự chăm chút dành cho học trò:</p>
<blockquote>“Lớp ít học sinh thì thầy cô càng sâu sát từng cháu. Muốn phụ huynh tin, thì mình phải làm cho thật.”</blockquote>
<p>Niềm tin ấy cũng là điều mà những gia đình đầu tiên phải cân nhắc khi lựa chọn một ngôi trường còn rất mới. Chị An Nhân có con vào lớp 6 năm 2016. Chị nhớ lại những băn khoăn của gia đình trước ngày con nhập học:</p>
<blockquote>“Năm 2016, cháu nhà tôi vào lớp 6. Nói thật là gia đình lo lắm. Người quen hỏi: ‘Trường mới mở, sao không chọn chỗ quen thuộc cho chắc?’. Tôi nghe cũng chột dạ.”</blockquote>
<p>Dù vậy, gia đình chị vẫn quyết định gửi con đến Phượng Hoàng. Sự lựa chọn ấy xuất phát từ niềm tin vào những người đứng sau ngôi trường mới và kỳ vọng về một môi trường giáo dục tốt cho con:</p>
<blockquote>“Nhưng tôi vẫn quyết tâm gửi con đến trường vì một niềm tin: tin vào cái tâm và trí tuệ của những người sáng lập và quản trị nhà trường. Sáng khai giảng hôm ấy, sân rộng mà học sinh thì lưa thưa, đứa nào cũng mặc đồng phục mới.”</blockquote>
<p>Những ấn tượng đầu tiên của người mẹ không đến từ những lời giới thiệu, mà từ chính trải nghiệm của con trong ngày đầu đến lớp:</p>
<blockquote>“Vào lớp, thầy cô biết tên từng đứa một. Chiều về, cháu kể chuyện không ngớt. Thấy con vui, tôi yên tâm được một nửa. Nửa còn lại, tôi để thời gian trả lời.”</blockquote>
<p>Sáng 04/9/2016, lễ khánh thành kiêm chào năm học mới diễn ra với sự tham dự của lãnh đạo Sở Giáo dục và Đào tạo, nhà đầu tư, phụ huynh và gần một trăm học sinh đầu tiên. NGƯT Đậu Văn Mùi là người đánh hồi trống khai giảng. Em Hồ Hải Đăng, học sinh lớp 6, thay mặt các bạn gửi lời hứa quyết tâm học tập. Bà Nguyễn Thị Kim Chi, Giám đốc Sở Giáo dục và Đào tạo Nghệ An khi đó, gửi gắm kỳ vọng Phượng Hoàng sẽ trở thành điểm sáng của phong trào xã hội hóa giáo dục tỉnh nhà.</p>
<p>Ngay trong tháng 9/2016, thầy và trò Nhà trường đã cùng nhau đến thăm, tặng quà trẻ em tại một trung tâm bảo trợ xã hội. Bên cạnh những bài học đầu tiên trong lớp, tinh thần sẻ chia và trách nhiệm với cộng đồng cũng được gieo mầm từ những ngày đầu tiên.</p>
<p>Ba lớp học đầu tiên, những người thầy tiên phong và những gia đình đặt niềm tin từ buổi ban đầu – tất cả đã cùng làm nên ngày khai trường đáng nhớ. Hồi trống ngày 04/9/2016 không chỉ mở đầu một năm học, mà còn đánh dấu bước khởi đầu của hành trình giáo dục Phượng Hoàng.</p>`},
 p8:{lead:"Từ ba lớp học đầu tiên trong năm học 2016–2017, Phượng Hoàng từng bước mở rộng quy mô, phát triển chương trình giáo dục và hoàn thiện mô hình trường liên cấp. Sáu năm đầu tiên không chỉ là hành trình lớn lên về số lượng, mà còn là quá trình xây dựng nền tảng chuyên môn, khẳng định chất lượng và vượt qua thử thách chưa từng có của đại dịch COVID-19.", body:`
<h3 class="sub">Lớn lên cùng mô hình (2017–2020)</h3>
<p>Những năm tiếp theo là quãng thời gian Phượng Hoàng lần lượt mở thêm các khối lớp ở bậc Tiểu học và Trung học cơ sở, đồng thời chuẩn bị lộ trình phát triển lên Trung học phổ thông. Từ một ngôi trường với ba lớp học ban đầu, quy mô từng bước được mở rộng, tạo nền tảng cho mô hình giáo dục liên cấp.</p>
<p>Cùng với sự phát triển về quy mô là những nỗ lực nâng cao chất lượng giáo dục. Năm học 2018–2019, Nhà trường lần đầu đạt danh hiệu Tập thể lao động tiên tiến và được Sở Giáo dục và Đào tạo tặng Giấy khen theo Quyết định số 618/QĐ-SGD-ĐT ngày 18/7/2019. Đây là một dấu mốc ghi nhận những cố gắng của tập thể thầy cô, cán bộ và nhân viên trong những năm đầu xây dựng trường.</p>
<p>Từ năm học 2019–2020, chương trình giáo dục theo định hướng STREAMS liên môn được triển khai, mở rộng cơ hội để học sinh tiếp cận kiến thức thông qua trải nghiệm, khám phá và vận dụng. Câu lạc bộ STEM Robotics với bộ LEGO Education WeDo 2.0 giúp học sinh tiểu học làm quen với tư duy lập trình và công nghệ từ sớm.</p>
<p>Học sinh Phượng Hoàng cũng bắt đầu bước ra những sân chơi rộng hơn: tham gia trại hè lãnh đạo thanh niên châu Á, các hoạt động giao lưu, trải nghiệm và rèn luyện bản lĩnh. Chuyến trải nghiệm tại Lữ đoàn 414 mang đến cho các em những bài học thực tế về kỷ luật, tinh thần tập thể và trách nhiệm.</p>
<p>Những bước chuyển ấy cho thấy Phượng Hoàng không chỉ mở rộng về số lớp, số học sinh, mà đang từng bước định hình một môi trường giáo dục kết hợp giữa kiến thức, kỹ năng và trải nghiệm.</p>
<h3 class="sub">Vượt dịch, vẹn tròn liên cấp (2020–2022)</h3>
<p>Đầu năm 2020, đại dịch COVID-19 khiến hoạt động giáo dục trên cả nước chịu ảnh hưởng nặng nề. Trường lớp vắng học sinh, những hoạt động quen thuộc phải tạm dừng, trong khi yêu cầu duy trì việc học và bảo đảm an toàn đặt ra nhiều thách thức cho mỗi nhà trường.</p>
<p>Với Phượng Hoàng, thử thách ấy đến vào một thời điểm đặc biệt. Trong kịch bản chuyển đổi sang dạy học trực tuyến, một quyết định được đưa ra ngay trong đêm thứ Sáu, mở đầu cho những ngày cuối tuần khẩn trương của toàn thể giáo viên và bộ phận hỗ trợ.</p>
<p>Cô Hương, giáo viên Ngữ văn gắn bó với Nhà trường từ năm 2016, nhớ lại:</p>
<blockquote>“Tối thứ Sáu hôm ấy có thông báo học sinh nghỉ học. 12 giờ đêm, Ban lãnh đạo nhà trường quyết định chuyển ngay sang dạy trực tuyến.”</blockquote>
<p>Không có nhiều thời gian chuẩn bị. Thầy cô cùng nhau kiểm tra thiết bị, thử đường truyền và tổ chức chạy thử từng lớp học. Hai ngày cuối tuần trở thành khoảng thời gian làm việc liên tục để sẵn sàng cho tuần học mới.</p>
<blockquote>“Thầy cô mình vốn đã quen dùng công nghệ trong dạy học, nên cả trường có hai ngày cuối tuần miệt mài chạy thử từng lớp, từng máy.”</blockquote>
<p>Sự chuyển đổi ấy không chỉ là câu chuyện của nhà trường và đội ngũ giáo viên. Với phụ huynh, đó cũng là những ngày phải học cách thích ứng để đồng hành cùng con. Chị An Nhân nhớ lại thời điểm ấy, khi Hải Đăng đang học lớp 9, đúng năm chuẩn bị thi vào lớp 10:</p>
<blockquote>“Năm ấy Đăng học lớp 9, đúng năm thi vào lớp 10. Cả cuối tuần, hai mẹ con ngồi thử máy, thử mạng cùng cô.”</blockquote>
<p>Sáng thứ Hai, toàn trường chính thức bước vào những giờ học trực tuyến.</p>
<blockquote>“Sáng thứ Hai, toàn trường chính thức học trực tuyến. Học sinh Phượng Hoàng không phải nghỉ học ngày nào.”</blockquote>
<p>Những ngày không thể đến trường trở thành một phép thử đối với khả năng thích ứng, sự chủ động và tinh thần trách nhiệm của cả tập thể. Nhưng đó cũng là khoảng thời gian mỗi người nhận ra rằng đổi mới giáo dục không đơn thuần nằm ở việc sử dụng công nghệ.</p>
<p>Cô Hương chia sẻ về điều mình nhận ra sau mùa dịch:</p>
<blockquote>“Qua mùa dịch, tôi hiểu đổi mới không phải là chỉ dùng một công cụ mới, mà là tìm mọi cách để không em nào bị bỏ lại phía sau, và phải giúp các em tiến bộ hơn chính mình so với hôm qua. Tôi trưởng thành lên cùng học trò của mình.”</blockquote>
<p>Năm học 2020–2021, trong bối cảnh dịch bệnh còn diễn biến phức tạp, Nhà trường tiếp tục duy trì hoạt động dạy và học, đồng thời từng bước hoàn thiện mô hình liên cấp. Đây cũng là năm học Phượng Hoàng có đủ ba cấp Tiểu học, Trung học cơ sở và Trung học phổ thông, hiện thực hóa mục tiêu tổ chức giáo dục liên thông từ lớp 1 đến lớp 12.</p>
<p>Năm học 2021–2022, những kết quả học tập và rèn luyện của học sinh tiếp tục ghi dấu sự trưởng thành của Nhà trường. Phượng Hoàng đạt danh hiệu Tập thể lao động tiên tiến, nhận Giấy khen của UBND thành phố Vinh và Sở Giáo dục và Đào tạo. Trong kỳ thi tuyển sinh vào lớp 10, khối Trung học cơ sở xếp thứ 7 trong số 28 trường toàn thành phố; có 8 học sinh đỗ vào các trường chuyên của tỉnh. Ở bậc Tiểu học, 9 học sinh lớp 5 đỗ vào Trường THCS Đặng Thai Mai. Học sinh còn đạt giải Nhì quốc gia cuộc thi TOEFL, giải Nhì cấp tỉnh Đấu trường Toán học, 5 giải học sinh giỏi cấp thành phố và có 2 học sinh tham gia thi Aerobic cấp quốc gia.</p>
<p>Tháng 9/2022, lễ khai giảng năm học thứ bảy chào đón 732 học sinh, quy mô tăng khoảng bảy lần so với năm học đầu tiên. Ông Bùi Đình Long, Phó Chủ tịch UBND tỉnh Nghệ An, về dự và ghi nhận những đóng góp của Nhà trường đối với giáo dục ngoài công lập, đánh dấu một chặng đường phát triển đáng nhớ.</p>
<p>Từ những lớp học đầu tiên đến một ngôi trường đủ ba cấp học; từ những giờ học trực tiếp đến những lớp học trực tuyến trong mùa dịch; từ những kết quả ban đầu đến sự trưởng thành của các thế hệ học sinh – Phượng Hoàng đã đi qua sáu năm đầu tiên bằng sự kiên trì, thích ứng và nỗ lực của nhiều thế hệ thầy cô, phụ huynh và học trò.</p>
<p>Giữ lửa, vì thế, không chỉ là giữ cho trường lớp tiếp tục hoạt động. Đó còn là giữ nhịp học tập, giữ niềm tin và giữ sự kết nối giữa những con người cùng chung một mái trường.</p>`},
 p10:{lead:"Từ một ngôi trường với ba cấp học được hình thành qua những năm đầu xây dựng, Phượng Hoàng bước vào giai đoạn 2022–2026 với những chuyển biến rõ nét về quy mô, chất lượng giáo dục và định hướng phát triển. Đây là chặng đường Nhà trường từng bước khẳng định mô hình giáo dục liên cấp, đồng thời định hình bản sắc và chuẩn bị cho một giai đoạn phát triển mới.", body:`
<h3 class="sub">Quả ngọt đầu tiên (2022–2024)</h3>
<p>Năm 2022 đánh dấu một bước chuyển quan trọng về cơ sở vật chất khi tòa nhà 10 tầng được đưa vào sử dụng, tạo thêm không gian học tập, sinh hoạt và trải nghiệm cho học sinh. Quy mô Nhà trường cũng tăng lên 732 học sinh trong năm học 2022–2023.</p>
<p>Cùng năm học ấy, khóa học sinh lớp 12 đầu tiên hoàn thành chương trình phổ thông và bước vào kỳ thi tốt nghiệp THPT. Theo thống kê của Nhà trường, toàn bộ học sinh khóa đầu đều trúng tuyển đại học, trong đó có bốn em lựa chọn con đường du học. Thành quả ấy mang ý nghĩa đặc biệt: sau nhiều năm xây dựng, mô hình giáo dục liên cấp đã có lứa học sinh đầu tiên trưởng thành và tiếp tục hành trình học tập ở những môi trường mới.</p>
<p>Năm 2024, Nhà trường được Giám đốc Sở Giáo dục và Đào tạo Nghệ An tặng Giấy khen vì thành tích xuất sắc trong kỳ thi tốt nghiệp THPT theo Quyết định số 1577/QĐ-SGD-ĐT ngày 13/8/2024. Đó là sự ghi nhận cho những nỗ lực trong công tác dạy và học ở cấp học cuối cùng của mô hình liên cấp.</p>
<p>Trong giai đoạn này, Phượng Hoàng cũng tiếp tục mở rộng các hoạt động trải nghiệm và phụng sự cộng đồng. Dự án nâng cao năng lực tiếng Anh cho trẻ em Làng trẻ SOS Vinh được triển khai từ năm 2022; tháng 9/2024, thầy cô, học sinh và phụ huynh cùng chung tay quyên góp 219 triệu đồng hỗ trợ các trường học tại một số tỉnh phía Bắc bị ảnh hưởng bởi bão lũ. Những hoạt động ấy cho thấy hành trình giáo dục không dừng lại trong khuôn viên trường học, mà còn hướng đến trách nhiệm với cộng đồng.</p>
<h3 class="sub">Vững vàng sải cánh (2024–2026)</h3>
<p>Bước vào giai đoạn 2024–2026, Phượng Hoàng tiếp tục phát triển ở quy mô 32 lớp với hơn 1.000 học sinh, cùng đội ngũ gần 100 cán bộ, giáo viên và nhân viên. Từ những ngày đầu với chưa đầy một trăm học sinh, Nhà trường đã có một hành trình mở rộng đáng kể, nhưng vẫn hướng tới việc duy trì môi trường học tập quan tâm đến từng cá nhân.</p>
<p>Đây cũng là giai đoạn định hình rõ hơn triết lý giáo dục: “Học để tự chủ – Trưởng thành để làm chủ tương lai”. Trên nền tảng năm trụ cột và hai mươi năng lực cốt lõi, Nhà trường từng bước xây dựng lộ trình phát triển học sinh xuyên suốt từ lớp 1 đến lớp 12, đồng thời mở rộng các chương trình giáo dục, ứng dụng công nghệ và trí tuệ nhân tạo trong dạy học, đổi mới hoạt động chuyên môn và tăng cường chăm sóc sức khỏe thể chất, tinh thần cho học sinh.</p>
<p>Những kết quả học tập, thành tích thi đua, hoạt động trải nghiệm và các chương trình giáo dục được triển khai trong giai đoạn này tiếp tục tạo nên những dấu ấn mới. Mỗi bước tiến đều gắn với nỗ lực của đội ngũ và sự đồng hành của phụ huynh, học sinh.</p>
<p>Tháng 9/2026, hơn một nghìn học sinh cùng bước vào năm học 2026–2027. Từ ba lớp học đầu tiên năm 2016 đến một cộng đồng giáo dục liên cấp ngày càng trưởng thành, Phượng Hoàng đã đi qua mười năm hoạt động giáo dục bằng sự kiên trì, đổi mới và khát vọng phát triển.</p>
<p>Chặng đường 10 năm khép lại cũng là lúc một hành trình mới mở ra. Ngọn lửa được tiếp nối, những trang sách tiếp tục được viết và đôi cánh Phượng Hoàng đang hướng về tương lai.</p>`},
};

/* ============================ ENGINE ============================ */
/* Dán URL Web app của Apps Script (kết thúc bằng /exec) vào đây để thu dữ liệu chung vào Google Sheet.
   Để trống = chỉ lưu trên thiết bị này. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwI2PRW7RA63xD7Efj44Ut-0HtlOViUIzl8cxQFoXXhW6cpQCRPouMFdpg9UERMvacD/exec';
const api = {
  async load(){ if (!API_URL) return null; try { return await (await fetch(API_URL + '?api=1')).json(); } catch { return null; } },
  async call(o){ if (!API_URL) return null; try { const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(o)}); return await r.json(); } catch { return null; } },
  async send(o){ const r = await this.call(o); return !!(r && r.ok); }
};
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const stage = $('#stage'), drawer = $('#drawer'), scrim = $('#scrim');
let cur = 0;

PAGES.forEach((p, i) => {
  const el = document.createElement('section');
  el.className = 'page ' + (p.cls || '');
  el.innerHTML = p.html + `<span class="pn">${i + 1} / ${PAGES.length}</span>`;
  stage.appendChild(el);
  p.el = el;
});

// TOC
const first = {};
PAGES.forEach((p, i) => { if (!(p.sec in first)) first[p.sec] = i; });
$('#tocList').innerHTML = SECTIONS.map(s =>
  `<a href="#p${first[s.id] + 1}" data-go="${first[s.id]}"><span class="n">${s.id}</span><span class="t">${s.title}</span><span class="d">${s.desc}</span></a>`).join('');

// Drawer
drawer.innerHTML = SECTIONS.map(s =>
  `<h4>${s.id}. ${s.title}</h4>` +
  PAGES.map((p, i) => p.sec === s.id ? `<button data-go="${i}">${p.title}</button>` : '').join('')).join('');

// Timeline
const tlItem = t => `<div class="it ${t.era ? 'era' : ''}"><b>${t.y}</b>${t.era ? `<span class="era-tag">${t.era}</span>` : ''}<div style="font-weight:600">${t.t}</div><p>${t.d}</p></div>`;
$('#tl').innerHTML = TIMELINE.map(tlItem).join('');
// Mốc do thành viên đóng góp (đã duyệt) được chen vào đúng năm; văn bản người dùng nhập luôn được escape
function renderTl(extra){
  const yr = s => +((String(s).match(/\d{4}/) || ['9999'])[0]);
  const all = [...TIMELINE.map(t => ({...t, _h: 1, _y: yr(t.y)})), ...extra.map(x => ({y: esc(x.ct.nam || ''), t: esc(x.t), d: esc(x.nd), _y: yr(x.ct.nam)}))];
  all.sort((a, b) => a._y - b._y);   // sort ổn định: mốc gốc đứng trước mốc đóng góp cùng năm
  $('#tl').innerHTML = all.map(tlItem).join('');
}

// Stories
const stGrid = $('#stGrid');
function renderStories(){
  const n = document.querySelectorAll('#stReal .card').length;   // chuyện đã đăng chiếm chỗ trước
  stGrid.innerHTML = STORIES.slice(Math.min(n, STORIES.length)).map(s =>
    `<div class="card story"><div class="no">${String(s.n).padStart(2,'0')}</div><div><h3>[Tên câu chuyện]</h3><p>Người kể gợi ý: ${s.who}</p><p style="margin-top:6px">400–500 chữ · 1–2 ảnh</p></div></div>`).join('');
}
renderStories();
function chips(sel, cb){
  document.querySelectorAll(sel + ' .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll(sel + ' .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); cb(c.textContent);
  });
}
chips('#fAch', f => document.querySelectorAll('[data-lv]').forEach(c => c.style.display = (f === 'Tất cả' || c.dataset.lv === f) ? '' : 'none'));

// Before/after slider
$('#baR').oninput = e => $('#baT').textContent = e.target.value < 50 ? 'Ngày ấy ◂' : e.target.value > 50 ? '▸ Hôm nay' : 'Ngày ấy ◂ ▸ Hôm nay';

// Thanks word cloud
let remote = null;   // dữ liệu chung từ Google Sheet (nếu có API_URL)
function renderCloud(){
  const list = [...(remote ? remote.thanks : []), ...store.get('thanks', [])];
  $('#thList').innerHTML = list.length
    ? list.map(t => { const m = String(t).match(/^“([\s\S]*)” — (.*)$/); return `<div class="thx"><q>${esc(m ? m[1] : t)}</q>${m ? `<small>${esc(m[2])}</small>` : ''}</div>`; }).join('')
    : '<div class="card blank"><p><span class="todo">chờ bài: 10–12 lời cảm ơn nguyên văn do nhóm thu thập gửi</span></p></div>';
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
// Gửi lên Sheet; nếu chưa cấu hình hoặc lỗi mạng thì giữ tạm trên thiết bị
async function submitTo(type, payload, localKey, btn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Đang gửi…';
  const ok = await api.send({type, ...payload});
  if (!ok) { const l = store.get(localKey, []); l.push(type === 'thanks' ? payload.text : payload); store.set(localKey, l); }
  btn.disabled = false; btn.textContent = old;
  return ok;
}
$('#thForm').onsubmit = async e => {
  e.preventDefault();
  const w = `“${$('#thIn').value.trim()}” — ${$('#thFrom').value.trim()} gửi ${$('#thTo').value.trim()}`;
  const ok = await submitTo('thanks', {text: w, consent: $('#thOk').checked}, 'thanks', e.submitter);
  e.target.reset(); renderCloud();
  if (ok) alert('Cảm ơn bạn! Lời cảm ơn sẽ hiện trong kỷ yếu sau khi Ban Biên soạn duyệt.');
};

// Alumni map pins (bản gửi lên Sheet chờ duyệt rồi mới hiện công khai)
function renderPins(){
  const p = [...(remote ? remote.pins : []), ...store.get('pins', [])];
  $('#mapbox').innerHTML = p.length ? p.map(x => `<span class="pin">📍 ${esc(x.name)} — ${esc(x.place)}</span>`).join('') : '<div class="mapnote">Chưa có ghim — hãy là người đầu tiên.</div>';
}
$('#mapForm').onsubmit = async e => {
  e.preventDefault();
  const ok = await submitTo('pin', {name: $('#mpName').value.trim(), place: $('#mpPlace').value.trim(), consent: $('#mpOk').checked}, 'pins', e.submitter);
  e.target.reset(); renderPins();
  if (ok) alert('Cảm ơn bạn! Thông tin sẽ hiện trên bản đồ sau khi Ban biên soạn duyệt.');
};
renderPins(); renderCloud();
api.load().then(d => { if (d) { remote = d; renderCloud(); renderPins(); applyContent(); renderContrib(); renderStories(); } });

// Time capsule
function renderCap(){
  const m = store.get('capsule', []);
  $('#capList').innerHTML = m.map(x => `<div class="msg"><b>${esc(x.name)}</b> <small>· ${esc(x.role)} · ${x.date}</small><br>${esc(x.msg)}</div>`).join('');
}
$('#capForm').onsubmit = async e => {
  e.preventDefault();
  const item = {name: $('#cpName').value.trim(), role: $('#cpRole').value, msg: $('#cpMsg').value.trim(), ok: $('#cpOk').checked};
  const sent = await api.send({type: 'capsule', ...item});
  // Thư riêng tư: chỉ hiện lại trên máy người viết, không đọc ngược từ Sheet
  const m = store.get('capsule', []);
  m.unshift({...item, date: new Date().toLocaleDateString('vi-VN'), sent});
  store.set('capsule', m); e.target.reset(); renderCap();
};
renderCap();

/* Chế độ biên tập: thành viên nhập mã truy cập (tab ThanhVien trong Google Sheet) rồi sửa chữ ngay trên trang.
   Vai trò admin / bientap đăng ngay, congtac chờ quản trị viên duyệt. Phân quyền được máy chủ kiểm tra lại. */
const ED_SEL = 'h2,h3,p,li,small,td,blockquote,.kick,.lead,.note';
const ED_SKIP = '#stGrid,#thList,#mapbox,#capList,#tocList,.pn,button,form';
const flat = s => String(s).replace(/\s+/g, ' ').trim();
PAGES.forEach(p => {
  [...p.el.querySelectorAll(ED_SEL)].filter(e => !e.closest(ED_SKIP) && !e.querySelector(ED_SEL)).forEach((e, n) => {
    e.dataset.ek = p.title + '#' + n; e.dataset.es = p.sec; e.dataset.eg = flat(e.textContent).slice(0, 40); e._cur = e.textContent;
  });
});
function applyContent(){
  if (!remote || !remote.content) return;
  document.querySelectorAll('[data-ek]').forEach(e => {
    const c = remote.content[e.dataset.ek];
    if (c && c.g === e.dataset.eg && !e.dataset.ed) { e.textContent = c.v; e._cur = c.v; }   // chỉ áp dụng khi văn bản gốc còn khớp
  });
}
let me = null; try { me = JSON.parse(sessionStorage.getItem('kyyeu_me')); } catch {}
const edbar = $('#edbar'), edmsg = $('#edmsg');
const canEdit = sec => me && (me.secs === 'all' || (me.secs || []).includes(sec));
const dirtyEls = () => [...document.querySelectorAll('[data-ed="1"]')];
function setEditing(on){
  document.body.classList.toggle('editing', on);
  edbar.classList.toggle('on', on); $('#edit').classList.toggle('on', on);
  document.querySelectorAll('[data-ek]').forEach(e => {
    if (on && canEdit(e.dataset.es)) {
      try { e.contentEditable = 'plaintext-only'; } catch {}
      if (!e.isContentEditable) e.contentEditable = 'true';
    } else e.removeAttribute('contenteditable');
  });
  $('#edMem').style.display = on && me.role === 'admin' ? '' : 'none';
  $('#edAdd').style.display = on ? '' : 'none';
  if (on) edmsg.textContent =`${me.name} · ${({admin:'Quản trị viên', bientap:'Biên tập viên', congtac:'Cộng tác viên'})[me.role]} · ${me.secs === 'all' ? 'mọi phần' : 'phần ' + me.secs.join(', ')}`;
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.ek) e.target.dataset.ed = '1'; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.ek) { e.preventDefault(); e.target.blur(); } });
async function login(){
  const code = (prompt('Nhập mã truy cập thành viên (do Ban biên soạn cấp):') || '').trim();
  if (!code) return false;
  const r = await api.call({type: 'login', code});
  if (!r) { alert('Chưa kết nối được máy chủ. Hãy thử lại sau.'); return false; }
  if (!r.ok) { alert('Mã không đúng, đã bị khóa hoặc bị tạm khóa do nhập sai nhiều lần.'); return false; }
  me = {code, name: r.name, role: r.role, secs: r.secs};
  try { sessionStorage.setItem('kyyeu_me', JSON.stringify(me)); } catch {}
  return true;
}
$('#edit').onclick = async () => {
  if (document.body.classList.contains('editing')) return $('#edExit').click();
  if (!me && !(await login())) return;
  setEditing(true);
};
$('#edExit').onclick = () => {
  const d = dirtyEls();
  if (d.length && !confirm('Có chỉnh sửa chưa lưu. Thoát và bỏ các thay đổi đó?')) return;
  d.forEach(e => { e.textContent = e._cur; delete e.dataset.ed; });
  setEditing(false);
};
$('#edOut').onclick = () => { $('#edExit').click(); if (!dirtyEls().length) { me = null; try { sessionStorage.removeItem('kyyeu_me'); } catch {} } };
$('#edSave').onclick = async () => {
  const d = dirtyEls(); if (!d.length) { alert('Chưa có thay đổi nào để lưu.'); return; }
  const items = d.map(e => ({k: e.dataset.ek, s: e.dataset.es, g: e.dataset.eg, v: flat(e.textContent)})).filter(x => x.v);
  const b = $('#edSave'); b.disabled = true; b.textContent = 'Đang lưu…';
  const r = await api.call({type: 'edit', code: me.code, items});
  b.disabled = false; b.textContent = 'Lưu';
  if (!r || !r.ok) { alert(r && r.error === 'code' ? 'Mã truy cập không còn hiệu lực.' : 'Chưa lưu được — hãy thử lại.'); return; }
  d.forEach(e => { const v = flat(e.textContent); if (!r.pending && remote) { remote.content = remote.content || {}; remote.content[e.dataset.ek] = {g: e.dataset.eg, v}; } e._cur = e.textContent; delete e.dataset.ed; });
  alert((r.saved ? `Đã lưu ${r.saved} đoạn` + (r.pending ? ' — đang chờ quản trị viên duyệt, sau đó mới hiện công khai.' : ' và hiển thị cho mọi người.') : 'Không có đoạn nào được lưu.') + (r.denied ? `\n${r.denied} đoạn nằm ngoài phần bạn được sửa nên bị bỏ qua.` : ''));
};

/* Cổng đóng góp: nội dung thành viên gửi (đã duyệt) tự hiện vào đúng trang */
function imgUrl(u){
  if (!/^https:\/\//i.test(u || '')) return '';
  const m = u.match(/drive\.google\.com\/.*?\/d\/([\w-]+)|drive\.google\.com\/.*?[?&]id=([\w-]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1] || m[2]}&sz=w900` : u;
}
const imgTag = (u, alt) => imgUrl(u) ? `<img class="cimg" src="${esc(imgUrl(u))}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer">` : '';
function renderContrib(){
  const c = remote && remote.contrib; if (!c) return;
  $('#stReal').innerHTML = c.story.map(s => `<div class="card story real" data-era="${esc(s.ct.era || '')}">${imgTag(s.anh, s.t)}<h3>${esc(s.t)}</h3>
    <p class="cmeta">${[s.ct.who, s.ct.vai, s.ct.lop, s.ct.era].filter(Boolean).map(esc).join(' · ')}</p>
    <details><summary>Đọc câu chuyện</summary><p style="white-space:pre-line">${esc(s.nd)}</p></details></div>`).join('');
  $('#achReal').innerHTML = c.achievement.map(a => `<div class="card" data-lv="${esc(a.ct.cap || '')}">${imgTag(a.anh, a.ct.ten)}<h3>${esc(a.ct.ten)}</h3>
    <p>${[a.t, a.ct.giai, a.ct.nam].filter(Boolean).map(esc).join(' · ')}</p>${a.nd ? `<p class="cmeta">${esc(a.nd)}</p>` : ''}</div>`).join('');
  $('#achTodo').style.display = c.achievement.length ? 'none' : '';
  if (c.milestone.length) renderTl(c.milestone);
}
const ctBox = $('#ctBox');
const FORM = {
  story: {tt: 'Tiêu đề câu chuyện', nd: 'Nội dung (chuyện kể sâu 400–500 chữ; lát cắt ký ức 50–150 chữ)', f: `
    <input name="who" placeholder="Người kể (họ tên)" maxlength="80" required>
    <select name="vai"><option>Thầy cô</option><option>Cựu học sinh</option><option>Phụ huynh</option><option>Học sinh</option><option>Khác</option></select>
    <input name="lop" placeholder="Lớp / tổ / đơn vị (không bắt buộc)" maxlength="80">
    <select name="era"><option>Thắp lửa</option><option>Giữ lửa</option><option>Sải cánh</option></select>`},
  achievement: {tt: 'Giải / thành tích', nd: 'Mô tả ngắn (không bắt buộc)', f: `
    <input name="ten" placeholder="Họ tên học sinh" maxlength="80" required>
    <input name="giai" placeholder="Kỳ thi / cuộc thi" maxlength="80">
    <input name="nam" placeholder="Năm (ví dụ 2024)" maxlength="12">
    <select name="cap"><option>Tiểu học</option><option>THCS</option><option>THPT</option></select>
    <label class="ck"><input type="checkbox" name="consent" required> Đã được phép công bố họ tên và ảnh (nếu có) của học sinh này.</label>`},
  milestone: {tt: 'Tiêu đề mốc', nd: 'Mô tả mốc — ghi rõ nguồn (văn bản, ngày, người xác nhận)', f: `
    <input name="nam" placeholder="Thời điểm (ví dụ 2018 hoặc 15/09/2017)" maxlength="30" required>`}
};
const LOAI_PHAN = {story: 'IV', achievement: 'III', milestone: 'II'};
const LOAI_TEN = {story: 'Câu chuyện (Phần IV)', achievement: 'Thành tích học sinh (Phần III)', milestone: 'Mốc thời gian (Phần II)'};
function ctDraw(){
  const ok = Object.keys(LOAI_PHAN).filter(k => canEdit(LOAI_PHAN[k]));
  if (!ok.length) { ctBox.innerHTML = '<p>Tài khoản của bạn chưa được giao phần nào để đóng góp. Hãy liên hệ Ban biên soạn.</p>'; return; }
  const k = ctBox.dataset.k && ok.includes(ctBox.dataset.k) ? ctBox.dataset.k : ok[0], F = FORM[k];
  ctBox.dataset.k = k;
  ctBox.innerHTML = `<form id="ctForm"><select name="loai" id="ctLoai">${ok.map(x => `<option value="${x}" ${x === k ? 'selected' : ''}>${LOAI_TEN[x]}</option>`).join('')}</select>
    <input name="tieude" placeholder="${F.tt}" maxlength="120" required>${F.f}
    <textarea name="noidung" rows="6" placeholder="${F.nd}" maxlength="2500" ${k === 'achievement' ? '' : 'required'}></textarea>
    <input name="anh" type="url" placeholder="Link ảnh (Google Drive đặt chế độ “Bất kỳ ai có đường liên kết”) — không bắt buộc">
    <p class="mn">Chỉ ghi thông tin có nguồn xác nhận. ${me.role === 'congtac' ? 'Bài của bạn sẽ chờ quản trị viên duyệt rồi mới hiện trong kỷ yếu.' : 'Bài sẽ hiện ngay trong kỷ yếu.'}</p>
    <button>Gửi đóng góp</button></form>`;
}
$('#edAdd').onclick = () => { ctBox.dataset.k = ''; ctDraw(); $('#ctWrap').classList.add('on'); };
$('#ctClose').onclick = () => $('#ctWrap').classList.remove('on');
ctBox.addEventListener('change', e => { if (e.target.id === 'ctLoai') { ctBox.dataset.k = e.target.value; ctDraw(); } });
ctBox.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f)), k = v.loai;
  const ct = {}; ['who','vai','lop','era','ten','giai','nam','cap'].forEach(n => { if (v[n]) ct[n] = v[n]; });
  const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Đang gửi…';
  const r = await api.call({type: 'contrib', code: me.code, loai: k, tieude: v.tieude, noidung: v.noidung, anh: v.anh, ct, consent: !!v.consent});
  b.disabled = false; b.textContent = 'Gửi đóng góp';
  if (!r || !r.ok) { alert(r && r.error === 'denied' ? 'Bạn chưa được giao phần này.' : r && r.error === 'code' ? 'Mã truy cập không còn hiệu lực.' : 'Chưa gửi được — kiểm tra các ô bắt buộc và thử lại.'); return; }
  if (!r.pending) { remote = remote || {thanks: [], pins: []}; remote.contrib = remote.contrib || {story: [], achievement: [], milestone: []}; remote.contrib[k].push({t: v.tieude, nd: v.noidung, ct, anh: v.anh}); renderContrib(); }
  $('#ctWrap').classList.remove('on');
  alert(r.pending ? 'Đã gửi! Bài đang chờ quản trị viên duyệt.' : 'Đã đăng vào kỷ yếu.');
});

/* Bảng quản trị (chỉ admin): thành viên + bài chờ duyệt */
const memBox = $('#memBox');
const ROLE = {admin:'Quản trị viên', bientap:'Biên tập viên', congtac:'Cộng tác viên'};
async function memLoad(){
  memBox.innerHTML = '<p>Đang tải…</p>';
  const r = await api.call({type: 'admin_list', code: me.code});
  if (!r || !r.ok) { memBox.innerHTML = '<p>Không tải được dữ liệu.</p>'; return; }
  memBox.innerHTML = `
    <h3>Bài chờ duyệt (${r.pending.length})</h3>` + (r.pending.length ? r.pending.map(x => `
    <div class="mrow"><div><b>${esc(x.ten)}</b> · ${esc(x.t)} · <small>${esc(x.k.split('#')[0])}</small><br>${esc(x.v)}</div>
    <span><button data-rv="1" data-row="${x.row}" data-k="${esc(x.k)}">Duyệt</button><button class="g" data-rv="0" data-row="${x.row}" data-k="${esc(x.k)}">Từ chối</button></span></div>`).join('') : '<p class="mn">Không có bài nào đang chờ.</p>') + `
    <h3>Đóng góp chờ duyệt (${(r.contribs || []).length})</h3>` + ((r.contribs || []).length ? r.contribs.map(x => `
    <div class="mrow"><div><b>${esc(x.k)}</b> · ${LOAI_TEN[x.loai] || esc(x.loai)}<br><small>${esc(x.ten)} · ${esc(x.t)}${x.anh ? ' · có ảnh' : ''}</small><br>${esc(x.nd)}<br><small>${esc(x.ct)}</small></div>
    <span><button data-rc="1" data-row="${x.row}" data-k="${esc(x.k)}">Duyệt</button><button class="g" data-rc="0" data-row="${x.row}" data-k="${esc(x.k)}">Từ chối</button></span></div>`).join('') : '<p class="mn">Không có đóng góp nào đang chờ.</p>') + `
    <h3>Thành viên (${r.members.length})</h3>` + r.members.map(x => `
    <div class="mrow ${x.on ? '' : 'off'}"><div><b>${esc(x.ten)}</b> · ${ROLE[x.vt] || esc(x.vt)} · phần ${esc(x.phan)}<br><small>Mã: <code>${esc(x.ma)}</code></small></div>
    <span>${x.me ? '<small>(bạn)</small>' : `<button class="g" data-tg="${x.row}" data-ma="${esc(x.ma)}">${x.on ? 'Khóa' : 'Mở lại'}</button>`}</span></div>`).join('') + `
    <h3>Thêm thành viên</h3>
    <form id="memAdd"><input name="ten" placeholder="Họ tên" required maxlength="60">
    <select name="vt"><option value="congtac">Cộng tác viên (chờ duyệt)</option><option value="bientap">Biên tập viên (đăng ngay)</option><option value="admin">Quản trị viên</option></select>
    <input name="phan" placeholder="Phần được sửa: I,II,…,VI hoặc all" value="I,II,III,IV,V,VI" maxlength="30"><button>Thêm &amp; tạo mã</button></form>`;
}
$('#edMem').onclick = () => { $('#memWrap').classList.add('on'); memLoad(); };
$('#memClose').onclick = () => $('#memWrap').classList.remove('on');
memBox.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  let r;
  if (b.dataset.rc != null) r = await api.call({type: 'admin_review_contrib', code: me.code, row: +b.dataset.row, k: b.dataset.k, yes: b.dataset.rc === '1'});
  else if (b.dataset.rv != null) r = await api.call({type: 'admin_review', code: me.code, row: +b.dataset.row, k: b.dataset.k, yes: b.dataset.rv === '1'});
  else if (b.dataset.tg) r = await api.call({type: 'admin_toggle', code: me.code, row: +b.dataset.tg, ma: b.dataset.ma});
  else return;
  if (!r || !r.ok) alert(r && r.error === 'stale' ? 'Dữ liệu vừa thay đổi, đang tải lại.' : 'Không thực hiện được.');
  memLoad();
});
memBox.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f));
  const r = await api.call({type: 'admin_add', code: me.code, ten: v.ten, vt: v.vt, phan: v.phan});
  if (!r || !r.ok) { alert('Chưa thêm được — kiểm tra họ tên và phần được sửa (I–VI).'); return; }
  await memLoad();
  prompt(`Đã tạo thành viên "${v.ten}". Mã truy cập (hãy gửi riêng cho người đó):`, r.code);
});

// Counting stats
function countUp(page){
  page.el.querySelectorAll('[data-n]').forEach(n => {
    const to = +n.dataset.n, step = Math.max(1, Math.ceil(to / 20)); let v = 0;
    const t = setInterval(() => { v = Math.min(to, v + step); n.textContent = v.toLocaleString('vi-VN'); if (v >= to) clearInterval(t); }, 60);
  });
}

// Navigation
function go(i, push = true){
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  PAGES.forEach((p, k) => { p.el.classList.toggle('on', k === i); p.el.classList.toggle('out', k < i); });
  PAGES[i].el.scrollTop = 0;
  cur = i;
  $('#prog').style.width = ((i + 1) / PAGES.length * 100) + '%';
  $('#lbl').textContent = `${i + 1} / ${PAGES.length} · ${PAGES[i].title}`;
  $('#prev').style.visibility = i ? '' : 'hidden';
  $('#next').style.visibility = i < PAGES.length - 1 ? '' : 'hidden';
  drawer.querySelectorAll('button').forEach(b => b.classList.toggle('cur', +b.dataset.go === i));
  if (push) history.replaceState(null, '', '#p' + (i + 1));
  closeDrawer();
  countUp(PAGES[i]);
}
function openDrawer(){ drawer.classList.add('on'); scrim.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }

document.addEventListener('click', e => {
  const vb = e.target.closest('[data-vid]');
  if (vb) { bg.pause(); vb.outerHTML = `<iframe class="vframe" src="${vb.dataset.yt ? 'https://www.youtube.com/embed/' + vb.dataset.vid + '?autoplay=1&rel=0' : 'https://drive.google.com/file/d/' + vb.dataset.vid + '/preview'}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; return; }
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(+g.dataset.go); return; }
  const id = e.target.closest('[data-goid]'); if (id) go(PAGES.findIndex(p => p.id === id.dataset.goid));
});
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#menu').onclick = openDrawer;
scrim.onclick = closeDrawer;
$('#print').onclick = () => window.print();
$('#share').onclick = async () => {
  const url = location.href;
  try { navigator.share ? await navigator.share({title: document.title, url}) : (await navigator.clipboard.writeText(url), alert('Đã sao chép liên kết trang này')); } catch {}
};
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  if (e.key === 'Escape') closeDrawer();
});
let sx = 0, sy = 0;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
stage.addEventListener('touchend', e => {
  if (document.body.classList.contains('editing')) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
}, {passive: true});

/* Nhạc nền: trình duyệt chỉ cho phát sau khi người dùng chạm vào trang, nên bắt đầu ở lần chạm đầu tiên. */
const MUSIC_URL = 'nhac-nen.mp3?v=3';
const bg = new Audio(MUSIC_URL);
bg.loop = true; bg.volume = 0.35; bg.preload = 'auto';
let musicOn = store.get('musicOn', true);
function paintMusic(){ $('#music').classList.toggle('off', !musicOn); }
function playMusic(){ if (musicOn) bg.play().catch(() => {}); }
$('#music').onclick = () => {
  musicOn = !musicOn; store.set('musicOn', musicOn); paintMusic();
  musicOn ? bg.play().catch(() => {}) : bg.pause();
};
paintMusic();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, function once(){
  document.removeEventListener(ev, once); playMusic();
}, {once: true}));
document.addEventListener('visibilitychange', () => { document.hidden ? bg.pause() : playMusic(); });

const m = location.hash.match(/^#p(\d+)$/);
go(m ? +m[1] - 1 : 0, false);
</script>
