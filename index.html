<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kỷ yếu Phượng Hoàng 2016–2026</title>
<meta name="description" content="Kỷ yếu 10 năm Truyền lửa – Sải cánh văn xuôi · Trường Phổ thông Liên cấp Phượng Hoàng">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1a14; --paper:#fff8ee; --paper2:#f6e9d3; --flame:#e8590c; --ember:#c92a2a; --gold:#e5a50a; --night:#1b1226; --muted:#7a6558;
  --shadow:0 20px 50px rgba(60,20,0,.25);
}
@media (prefers-color-scheme:dark){:root{--ink:#f5e8d8;--paper:#241a1d;--paper2:#2e2024;--muted:#b9a496;--night:#120b18}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#4a1d12 0,var(--night) 70%);overflow:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:54px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left));z-index:20;color:#ffe9cf}
.bar .brand{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.02em;font-size:17px}
.bar .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.1)}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn.off{opacity:.55;text-decoration:line-through}
.prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--ember));z-index:30;transition:width .4s}

/* book */
.stage{position:fixed;inset:54px 0 64px 0;display:grid;place-items:center;perspective:1800px;padding:0 12px}
.page{position:absolute;width:min(920px,100%);height:100%;max-height:760px;background:var(--paper);border-radius:6px 14px 14px 6px;box-shadow:var(--shadow);overflow:auto;padding:clamp(22px,4vw,52px);opacity:0;pointer-events:none;transform:rotateY(-14deg) translateX(40px);transform-origin:left center;transition:opacity .45s,transform .55s cubic-bezier(.2,.7,.2,1)}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page.out{transform:rotateY(14deg) translateX(-40px)}
.page::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent);pointer-events:none}
.pn{position:absolute;right:20px;bottom:12px;font-size:12px;color:var(--muted)}
.kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--flame);font-weight:600;margin-bottom:8px}
.page h2{font-size:clamp(26px,4.2vw,40px);margin-bottom:6px}
.lead{color:var(--muted);margin:6px 0 22px;max-width:62ch}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding:6px 12px;margin-top:18px;background:rgba(229,165,10,.08);border-radius:0 8px 8px 0}
.todo{display:inline-block;background:#fff1c9;color:#7a5200;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
@media (prefers-color-scheme:dark){.todo{background:#4a3a10;color:#ffd77a}}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff3df;background:radial-gradient(circle at 50% 78%,#ff9d2e 0,#e8590c 22%,#8e1b1b 55%,#2a0f16 100%)}
.cover::before{display:none}
.cover .flame{font-size:84px;filter:drop-shadow(0 0 28px #ffb347);animation:fl 2.6s ease-in-out infinite}
@keyframes fl{50%{transform:scale(1.07) translateY(-4px)}}
.cover h1{font-size:clamp(38px,8vw,78px);font-weight:800;margin:8px 0}
.cover .yr{font-size:clamp(18px,3vw,28px);letter-spacing:.3em;color:#ffd98a}
.cover .tag{margin-top:18px;font-size:15px;opacity:.9;max-width:44ch}
.cover .path{margin-top:30px;display:flex;gap:10px;align-items:center;font-size:14px;color:#ffd98a}
.cover .start{margin-top:34px;padding:13px 30px;border-radius:99px;background:#fff3df;color:#8e1b1b;font-weight:700}
.cover .pn{color:#ffd98a}

/* toc */
.toc a{display:flex;gap:14px;align-items:baseline;padding:10px 4px;border-bottom:1px dashed rgba(122,101,88,.35);text-decoration:none;color:inherit}
.toc a:hover{color:var(--flame)}
.toc .n{font-family:'Playfair Display';font-weight:800;color:var(--flame);width:2.2em}
.toc .d{flex:1;font-size:13px;color:var(--muted)}
.toc .t{font-weight:600}

/* generic grids */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--paper2);border-radius:14px;padding:16px}
.card h3{font-size:18px;margin-bottom:4px}
.card p{font-size:14px;color:var(--muted)}
.ph{aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(45deg,rgba(232,89,12,.1) 0 10px,rgba(232,89,12,.18) 10px 20px);display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:8px;margin-bottom:10px}
.ph.p{aspect-ratio:3/4}
.qr{display:inline-flex;align-items:center;gap:8px;font-size:12px;border:1px dashed var(--flame);padding:5px 10px;border-radius:8px;color:var(--flame);margin-top:8px}
.qr i{font-style:normal;font-size:16px}

/* timeline */
.tl{position:relative;margin-left:8px;padding-left:26px;border-left:3px solid;border-image:linear-gradient(var(--gold),var(--ember)) 1}
.tl .it{position:relative;margin-bottom:16px;cursor:pointer}
.tl .it::before{content:"";position:absolute;left:-36px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--flame)}
.tl .it.era::before{background:var(--flame)}
.tl b{font-family:'Playfair Display';font-size:19px;color:var(--flame)}
.tl p{font-size:14px;color:var(--muted)}
.era-tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--flame);color:#fff;margin-left:8px;vertical-align:middle}

/* 3 chapters */
.chap{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chap .c{border-radius:16px;padding:22px;color:#fff}
.c1{background:linear-gradient(135deg,#f08c00,#e8590c)}.c2{background:linear-gradient(135deg,#e8590c,#c92a2a)}.c3{background:linear-gradient(135deg,#c92a2a,#5f1d48)}
.chap .c .ic{font-size:34px}.chap .c h3{font-size:24px;margin:6px 0}.chap .c small{opacity:.85}

/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{text-align:center;padding:18px 8px;border-radius:14px;background:var(--paper2)}
.stat .v{font-family:'Playfair Display';font-size:34px;font-weight:800;color:var(--flame)}
.stat .l{font-size:12.5px;color:var(--muted)}

/* pillars */
.pill{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:640px){.pill{grid-template-columns:repeat(2,1fr)}}
.pill div{background:linear-gradient(var(--paper2),var(--paper));border:1px solid rgba(229,165,10,.4);border-radius:12px;padding:14px 8px;text-align:center;font-weight:600;font-size:14px}
.pill div span{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}

/* stories */
.story{display:flex;gap:14px;align-items:flex-start}
.story .no{font-family:'Playfair Display';font-size:40px;font-weight:800;color:var(--flame);line-height:1}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:99px;background:var(--paper2);font-size:13px}
.chip.on{background:var(--flame);color:#fff}

/* form */
form.cap{display:grid;gap:10px;max-width:560px}
input,textarea,select{font:inherit;width:100%;padding:11px 13px;border-radius:10px;border:1px solid rgba(122,101,88,.4);background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{padding:12px 22px;border-radius:99px;background:linear-gradient(90deg,var(--flame),var(--ember));color:#fff;font-weight:700;justify-self:start}
.msgs{display:grid;gap:10px;margin-top:20px}
.msg{background:var(--paper2);border-radius:12px;padding:12px 14px;font-size:14px}
.msg small{color:var(--muted)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;height:64px;display:flex;align-items:center;justify-content:center;gap:16px;z-index:20;color:#ffe9cf}
.nav .lbl{min-width:180px;text-align:center;font-size:13px;opacity:.9}

/* drawer */
.drawer{position:fixed;inset:0 auto 0 0;width:min(340px,86vw);background:var(--paper);z-index:40;transform:translateX(-105%);transition:transform .35s;padding:70px 18px 18px;overflow:auto;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer button{display:block;width:100%;text-align:left;padding:10px 8px;border-radius:8px;font-size:14px}
.drawer button:hover,.drawer button.cur{background:var(--paper2);color:var(--flame)}
.drawer h4{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--flame);margin:14px 8px 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;pointer-events:none;transition:.3s}
.scrim.on{opacity:1;pointer-events:auto}
@media(max-width:560px){.bar .brand{font-size:14px}.nav .lbl{min-width:120px}.stage{inset:54px 0 64px 0;padding:0 6px}}
@media print{body{overflow:visible;background:#fff}.bar,.nav,.prog{display:none}.stage{position:static;display:block}.page{position:static;opacity:1;transform:none;box-shadow:none;max-height:none;height:auto;page-break-after:always;overflow:visible}}
</style>
</head>

   <div class="kick">Phần V · Sải cánh vươn xa</div>
   <h2 style="font-size:clamp(30px,5vw,52px);margin-top:10vh">Trang tiếp theo<br><span style="color:var(--flame)">thuộc về học trò hôm nay.</span></h2>
   <p class="lead" style="margin-top:20px">Những trang trắng dành cho lời nhắn hoặc cam kết cho hành trình tiếp theo của Phượng Hoàng.</p>
   <button class="btn" data-goid="capsule">Viết lời nhắn →</button>
   <div style="margin-top:34px;font-size:56px">🔥 → 📖 → 🕊️</div>`}
];

/* ============================ ENGINE ============================ */
/* Dán URL Web app của Apps Script (kết thúc bằng /exec) vào đây để thu dữ liệu chung vào Google Sheet.
   Để trống = chỉ lưu trên thiết bị này. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwI2PRW7RA63xD7Efj44Ut-0HtlOViUIzl8cxQFoXXhW6cpQCRPouMFdpg9UERMvacD/exec';
const api = {
  async load(){ if (!API_URL) return null; try { return await (await fetch(API_URL + '?api=1')).json(); } catch { return null; } },
  async send(o){ if (!API_URL) return false; try { const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(o)}); return (await r.json()).ok; } catch { return false; } }
};
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const stage = $('#stage'), drawer = $('#drawer'), scrim = $('#scrim');
let cur = 0;

PAGES.forEach((p, i) => {
  const el = document.createElement('section');
  el.className = 'page ' + (p.cls || '');
  el.innerHTML = p.html + `<span class="pn">${i + 1} / ${PAGES.length}</span>`;
  stage.appendChild(el);
  p.el = el;
});

// TOC
const first = {};
PAGES.forEach((p, i) => { if (!(p.sec in first)) first[p.sec] = i; });
$('#tocList').innerHTML = SECTIONS.map(s =>
  `<a href="#p${first[s.id] + 1}" data-go="${first[s.id]}"><span class="n">${s.id}</span><span class="t">${s.title}</span><span class="d">${s.desc}</span></a>`).join('');

// Drawer
drawer.innerHTML = SECTIONS.map(s =>
  `<h4>${s.id}. ${s.title}</h4>` +
  PAGES.map((p, i) => p.sec === s.id ? `<button data-go="${i}">${p.title}</button>` : '').join('')).join('');

// Timeline
$('#tl').innerHTML = TIMELINE.map(t =>
  `<div class="it ${t.era ? 'era' : ''}"><b>${t.y}</b>${t.era ? `<span class="era-tag">${t.era}</span>` : ''}<div style="font-weight:600">${t.t}</div><p>${t.d}</p></div>`).join('');

// Stories
const stGrid = $('#stGrid');
function renderStories(f = 'Tất cả'){
  stGrid.innerHTML = STORIES.filter(s => f === 'Tất cả' || s.era === f).map(s =>
    `<div class="card story"><div class="no">${String(s.n).padStart(2,'0')}</div><div><h3>[Tên câu chuyện]</h3><p>${s.era} · ${s.who}</p><p style="margin-top:6px">~150–200 chữ · 1 ảnh</p></div></div>`).join('');
}
renderStories();
function chips(sel, cb){
  document.querySelectorAll(sel + ' .chip').forEach(c => c.onclick = () => {
    document.querySelectorAll(sel + ' .chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); cb(c.textContent);
  });
}
chips('#fSt', renderStories);
chips('#fAch', f => document.querySelectorAll('[data-lv]').forEach(c => c.style.display = (f === 'Tất cả' || c.dataset.lv === f) ? '' : 'none'));

// Before/after slider
$('#baR').oninput = e => $('#baT').textContent = e.target.value < 50 ? 'Xưa ◂' : e.target.value > 50 ? '▸ Nay' : 'Xưa ◂ ▸ Nay';

// Thanks word cloud
const SEED_THANKS = ['Tri ân thầy cô','Biết ơn','Yêu thương','Tự hào','Cảm ơn Phượng Hoàng','Gắn bó','Trưởng thành'];
let remote = null;   // dữ liệu chung từ Google Sheet (nếu có API_URL)
function renderCloud(){
  const words = [...(remote ? remote.thanks : SEED_THANKS), ...store.get('thanks', [])];
  $('#cloud').innerHTML = words.map((w, i) =>
    `<span style="font-size:${14 + (w.length * 7 + i * 5) % 20}px;color:hsl(${(i * 37) % 40 + 5} 80% 48%)">${esc(w)}</span>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
// Gửi lên Sheet; nếu chưa cấu hình hoặc lỗi mạng thì giữ tạm trên thiết bị
async function submitTo(type, payload, localKey, btn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Đang gửi…';
  const ok = await api.send({type, ...payload});
  if (!ok) { const l = store.get(localKey, []); l.push(type === 'thanks' ? payload.text : payload); store.set(localKey, l); }
  btn.disabled = false; btn.textContent = old;
  return ok;
}
$('#thForm').onsubmit = async e => {
  e.preventDefault();
  const w = $('#thIn').value.trim();
  const ok = await submitTo('thanks', {text: w}, 'thanks', e.submitter);
  if (ok) { remote = remote || {thanks: [], pins: []}; remote.thanks.push(w); }   // hiện ngay, không chờ tải lại
  $('#thIn').value = ''; renderCloud();
};

// Alumni map pins (bản gửi lên Sheet chờ duyệt rồi mới hiện công khai)
function renderPins(){
  const p = [...(remote ? remote.pins : []), ...store.get('pins', [])];
  $('#mapbox').innerHTML = p.length ? p.map(x => `<span class="pin">📍 ${esc(x.name)} — ${esc(x.place)}</span>`).join('') : '<div class="mapnote">Chưa có ghim — hãy là người đầu tiên.</div>';
}
$('#mapForm').onsubmit = async e => {
  e.preventDefault();
  const ok = await submitTo('pin', {name: $('#mpName').value.trim(), place: $('#mpPlace').value.trim(), consent: $('#mpOk').checked}, 'pins', e.submitter);
  e.target.reset(); renderPins();
  if (ok) alert('Cảm ơn bạn! Thông tin sẽ hiện trên bản đồ sau khi Ban biên soạn duyệt.');
};
renderPins();
api.load().then(d => { if (d) { remote = d; renderCloud(); renderPins(); } });

// Time capsule
function renderCap(){
  const m = store.get('capsule', []);
  $('#capList').innerHTML = m.map(x => `<div class="msg"><b>${esc(x.name)}</b> <small>· ${esc(x.role)} · ${x.date}</small><br>${esc(x.msg)}</div>`).join('');
}
$('#capForm').onsubmit = async e => {
  e.preventDefault();
  const item = {name: $('#cpName').value.trim(), role: $('#cpRole').value, msg: $('#cpMsg').value.trim(), ok: $('#cpOk').checked};
  const sent = await api.send({type: 'capsule', ...item});
  // Thư riêng tư: chỉ hiện lại trên máy người viết, không đọc ngược từ Sheet
  const m = store.get('capsule', []);
  m.unshift({...item, date: new Date().toLocaleDateString('vi-VN'), sent});
  store.set('capsule', m); e.target.reset(); renderCap();
};
renderCap();

// Counting stats
function countUp(page){
  page.el.querySelectorAll('[data-n]').forEach(n => {
    const to = +n.dataset.n; let v = 0;
    const t = setInterval(() => { v++; n.textContent = v; if (v >= to) clearInterval(t); }, 70);
  });
}

// Navigation
function go(i, push = true){
  i = Math.max(0, Math.min(PAGES.length - 1, i));
  PAGES.forEach((p, k) => { p.el.classList.toggle('on', k === i); p.el.classList.toggle('out', k < i); });
  PAGES[i].el.scrollTop = 0;
  cur = i;
  $('#prog').style.width = ((i + 1) / PAGES.length * 100) + '%';
  $('#lbl').textContent = `${i + 1} / ${PAGES.length} · ${PAGES[i].title}`;
  $('#prev').style.visibility = i ? '' : 'hidden';
  $('#next').style.visibility = i < PAGES.length - 1 ? '' : 'hidden';
  drawer.querySelectorAll('button').forEach(b => b.classList.toggle('cur', +b.dataset.go === i));
  if (push) history.replaceState(null, '', '#p' + (i + 1));
  closeDrawer();
  countUp(PAGES[i]);
}
function openDrawer(){ drawer.classList.add('on'); scrim.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(+g.dataset.go); return; }
  const id = e.target.closest('[data-goid]'); if (id) go(PAGES.findIndex(p => p.id === id.dataset.goid));
});
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#menu').onclick = openDrawer;
scrim.onclick = closeDrawer;
$('#print').onclick = () => window.print();
$('#share').onclick = async () => {
  const url = location.href;
  try { navigator.share ? await navigator.share({title: document.title, url}) : (await navigator.clipboard.writeText(url), alert('Đã sao chép liên kết trang này')); } catch {}
};
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  if (e.key === 'Escape') closeDrawer();
});
let sx = 0, sy = 0;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
}, {passive: true});

/* Nhạc nền: trình duyệt chỉ cho phát sau khi người dùng chạm vào trang, nên bắt đầu ở lần chạm đầu tiên. */
const MUSIC_URL = 'nhac-nen.mp3';
const bg = new Audio(MUSIC_URL);
bg.loop = true; bg.volume = 0.35; bg.preload = 'auto';
let musicOn = store.get('musicOn', true);
function paintMusic(){ $('#music').classList.toggle('off', !musicOn); }
function playMusic(){ if (musicOn) bg.play().catch(() => {}); }
$('#music').onclick = () => {
  musicOn = !musicOn; store.set('musicOn', musicOn); paintMusic();
  musicOn ? bg.play().catch(() => {}) : bg.pause();
};
paintMusic();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, function once(){
  document.removeEventListener(ev, once); playMusic();
}, {once: true}));
document.addEventListener('visibilitychange', () => { document.hidden ? bg.pause() : playMusic(); });

const m = location.hash.match(/^#p(\d+)$/);
go(m ? +m[1] - 1 : 0, false);
</script>
</body>
</html>
