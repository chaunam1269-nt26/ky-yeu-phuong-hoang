name: tmp transcribe
on:
  push:
    branches: [tmp-transcribe]
    paths: ['_tr/*.wav']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q faster-whisper
      - run: |
          cat > tr.py <<'PY'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel('medium', device='cpu', compute_type='int8')
          out = {}
          for f in ['a1', 'a2']:
              segs, info = m.transcribe(f'_tr/{f}.wav', language='vi', word_timestamps=True, vad_filter=False, beam_size=5)
              out[f] = [{'s': round(s.start, 2), 'e': round(s.end, 2), 't': s.text.strip(), 'w': [[round(w.start, 2), round(w.end, 2), w.word] for w in (s.words or [])]} for s in segs]
          json.dump(out, open('_tr/transcript.json', 'w'), ensure_ascii=False, indent=1)
          PY
          python tr.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add _tr/transcript.json; git commit -m transcript; git push
