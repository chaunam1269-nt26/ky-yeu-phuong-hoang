name: tmp images
on:
  push:
    branches: [tmp-transcribe]
    paths: ['_tr/imglist.txt']
permissions:
  contents: write
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _tr/img
          while read n u; do curl -sfL -m 60 -o "_tr/img/$n.jpg" "$u" || echo "fail $n"; done < _tr/imglist.txt
          ls _tr/img | wc -l
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add _tr/img; git commit -m imgs; git push
